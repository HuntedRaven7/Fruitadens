name: Reusable Build

on:
  workflow_call:
    inputs:
      stream:
        required: true
        type: string
      upstream-image:
        required: true
        type: string
      push:
        required: false
        type: boolean
        default: false
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false
      SIGNING_SECRET:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpp podman

      - name: Preprocess Containerfile
        run: cpp -P -C -traditional-cpp Containerfile.in > Containerfile

      - name: Build image
        run: |
          podman build --layers \
            -f Containerfile \
            -t ghcr.io/fruitadens/fruitadens:${{ inputs.stream }}-local .

      - name: Inspect image
        id: inspect
        run: |
          podman inspect ghcr.io/fruitadens/fruitadens:${{ inputs.stream }}-local --format '{{index .Id}}' | tee image-digest.txt
          echo "digest=$(cat image-digest.txt)" >> $GITHUB_OUTPUT

      - name: Push image
        id: push-image
        if: ${{ inputs.push && secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_PASSWORD != '' }}
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          echo "${REGISTRY_PASSWORD}" | podman login ghcr.io -u "${REGISTRY_USERNAME}" --password-stdin
          podman push --digestfile=/tmp/digestfile ghcr.io/fruitadens/fruitadens:${{ inputs.stream }}-local ghcr.io/fruitadens/fruitadens:${{ inputs.stream }}-${{ github.run_number }}
          podman push --digestfile=/tmp/digestfile ghcr.io/fruitadens/fruitadens:${{ inputs.stream }}-local ghcr.io/fruitadens/fruitadens:${{ inputs.stream }}
          echo "digest=$(cat /tmp/digestfile)" >> $GITHUB_OUTPUT

      - name: Skip push (missing secrets)
        if: ${{ inputs.push && (secrets.REGISTRY_USERNAME == '' || secrets.REGISTRY_PASSWORD == '') }}
        run: |
          echo "::warning::Skipping push: REGISTRY_USERNAME or REGISTRY_PASSWORD secret is not set."

      - name: Install Cosign
        if: ${{ inputs.push && secrets.SIGNING_SECRET != '' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: 'v3.1.2'

      - name: Sign container image
        if: ${{ inputs.push && secrets.SIGNING_SECRET != '' }}
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ghcr.io/fruitadens/fruitadens@${DIGEST}

      - name: Skip signing (missing secret)
        if: ${{ inputs.push && secrets.SIGNING_SECRET == '' }}
        run: |
          echo "::warning::Skipping signing: SIGNING_SECRET is not set."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fruitadens-${{ inputs.stream }}
          path: |
            Containerfile
            image-digest.txt
